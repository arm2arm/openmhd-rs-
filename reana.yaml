version: 0.9.0
inputs:
  files:
    - source.bundle.part000
    - source.tar.gz.part000
    - snapshot.json
    - remote.py
  parameters:
    study: smoke
    jobs: 24
workflow:
  type: serial
  specification:
    steps:
      - name: prepare-source-and-rust
        environment: 'gitlab-p4n.aip.de:5005/p4nreana/reana-env@sha256:aebd7911df9e1e97ad67d15f4c32ab23996000282183fad3bf7a480756522bd7'
        compute_backend: kubernetes
        kubernetes_memory_limit: '8Gi'
        commands:
          - python3 remote.py prepare
      - name: run-tests
        environment: 'gitlab-p4n.aip.de:5005/p4nreana/reana-env@sha256:aebd7911df9e1e97ad67d15f4c32ab23996000282183fad3bf7a480756522bd7'
        compute_backend: kubernetes
        kubernetes_memory_limit: '64G'
        commands:
          - python3 remote.py run --study "${study}" --jobs "${jobs}"
outputs:
  files:
    - outputs/execution.json
    - outputs/runtime.json
    - outputs/artifacts.sha256.json
