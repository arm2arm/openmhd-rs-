[package]
name = "openmhd-mpi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "MPI rank ownership and hybrid numerical drivers for OpenMHD"

[workspace]
resolver = "3"

[dependencies]
mpi = { version = "=0.8.0", default-features = false }
mhd-parallel = { path = "../../crates/mhd-parallel" }
galaxy-types = { path = "../../crates/galaxy-types" }
moving-mesh = { path = "../../crates/moving-mesh" }
mhd-core = { path = "../../crates/mhd-core" }
gravity = { path = "../../crates/gravity" }
mhd-io = { path = "../../crates/mhd-io" }
