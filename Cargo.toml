[workspace]
members = ["crates/mhd-core", "crates/mhd-io", "crates/moving-mesh", "crates/mhd-planar", "crates/mhd-vector-pot", "apps/field-loop", "apps/openmhd"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/arm2arm/openmhd-rs-"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
